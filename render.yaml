services:
  # Main Fullstack Web Service
  - type: web
    name: real-estate-crm
    env: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        fromDatabase:
          name: crm-mongodb
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false

databases:
  # Managed MongoDB Instance (Render Managed)
  - name: crm-mongodb
    databaseName: real_estate_crm
    user: crm_user
    plan: starter
    region: oregon